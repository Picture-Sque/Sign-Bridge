# Lint and tests (decision 0001). Linux jobs run on every push; the Windows
# job runs on pull requests to main only, so PR commits are not tested on
# Linux twice.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in step with [tool.uv] required-version in pyproject.toml.
  UV_VERSION: "0.13.5"

jobs:
  ts:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  python:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      # Python lint is a root npm script, so Node is needed here too.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: uv sync --locked
      - run: npm run lint:py
      - run: uv run pytest

  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: uv sync --locked
      - run: npm run lint:py
      - run: uv run pytest
